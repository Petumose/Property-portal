<style>

  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); position:relative; overflow:hidden; }
  #login-screen::before { content:''; position:absolute; width:600px; height:600px; background:radial-gradient(circle,rgba(61,153,112,0.06) 0%,transparent 70%); top:-100px; left:-100px; pointer-events:none; }
  .login-card { width:420px; background:var(--surface); border:0.5px solid var(--border); border-radius:20px; padding:2.5rem; position:relative; z-index:1; }
  .login-logo { width:44px; height:44px; background:var(--accent-dim); border:1px solid rgba(61,153,112,0.3); border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem; }
  .login-title { font-family:'DM Serif Display',serif; font-size:26px; color:var(--text); margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--muted); margin-bottom:2rem; font-weight:300; }
  .field-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; display:block; }
  .field { margin-bottom:1.1rem; }
  .field input { width:100%; background:var(--bg); border:0.5px solid rgba(255,255,255,0.1); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.2s; }
  .field input:focus { border-color:rgba(61,153,112,0.5); }
  .btn-login { width:100%; padding:12px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:14px; font-family:'DM Sans',sans-serif; font-weight:500; cursor:pointer; transition:opacity 0.2s; margin-top:0.5rem; }
  .btn-login:hover { opacity:0.88; }
  .error-msg { background:var(--danger-dim); border:0.5px solid rgba(192,57,43,0.25); border-radius:8px; padding:10px 14px; color:#e07070; font-size:13px; margin-bottom:1rem; display:none; }
  .loading-msg { background:var(--accent-dim); border:0.5px solid rgba(61,153,112,0.25); border-radius:8px; padding:10px 14px; color:var(--accent); font-size:13px; margin-bottom:1rem; display:none; text-align:center; }
  #app { display:none; }
  nav { border-bottom:0.5px solid var(--border); padding:0 2rem; position:sticky; top:0; background:rgba(10,13,15,0.95); backdrop-filter:blur(12px); z-index:100; }
  .nav-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:56px; }
  .nav-brand { display:flex; align-items:center; gap:10px; }
  .nav-icon { width:28px; height:28px; background:var(--accent-dim); border:1px solid rgba(61,153,112,0.3); border-radius:7px; display:flex; align-items:center; justify-content:center; }

  .nav-right { display:flex; align-items:center; gap:14px; }

  main { max-width:960px; margin:0 auto; padding:2.5rem 2rem; }
  .page-eyebrow { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; }
  .page-title { font-family:'DM Serif Display',serif; font-size:28px; color:var(--text); font-weight:400; margin-bottom:2.2rem; }
  .alert { border-radius:12px; padding:14px 18px; display:flex; align-items:flex-start; gap:10px; margin-bottom:1.8rem; font-size:13.5px; line-height:1.6; }

  .insight { background:var(--surface2); border:0.5px solid rgba(61,153,112,0.18); border-radius:12px; padding:14px 18px; margin-bottom:1.8rem; display:flex; gap:10px; align-items:flex-start; }

  @media (max-width:600px) { main { padding:1.5rem 1rem; } .cards { grid-template-columns:repeat(2,1fr); } .login-card { width:92vw; padding:1.8rem; } }
</style>

// ── FETCH SHEET ──────────────────────────────
async function fetchSheet(sheetName) {
  const name = sheetName.trim();
  const needsQuotes = name.includes('.') || name.includes(' ');
  const safeName = needsQuotes ? "'" + name + "'" : name;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${safeName}!A1:Z1000?key=${API_KEY}&valueRenderOption=FORMATTED_VALUE`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheet error: ${name} (${res.status})`);
  return (await res.json()).values || [];
}

// ── PARSE ────────────────────────────────────
function parseKsh(val, allowNeg) {
  if (!val) return 0;
  const trimmed = val.toString().trim();
  // Dash alone means zero
  if (/^-+$/.test(trimmed.replace(/\s/g,''))) return 0;
  const s = trimmed.replace(/,/g,'').replace(/[^0-9.\-]/g,'');
  const n = parseFloat(s);
  if (isNaN(n)) return 0;
  return allowNeg ? n : Math.abs(n);
}

function parseSheet(rows, unitName, ownerName) {
  const MONTH_RE = /^(january|february|march|april|may|june|july|august|september|october|november|december)[\s\-–]?\d{2}/i;
  const months = [];
  let currentMonth = null;
  let waterBF = 0, serviceBF = 0;
  let pendingW = 0, pendingS = 0, pendingP = 0;

  // Detect water/service column positions from first header row
  let wCol = 3, sCol = 4, tCol = 5;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].map(c=>(c||'').toString().trim().toLowerCase());
    for (let j = 0; j < r.length; j++) {
      if (r[j].includes('water bill')) { wCol=j; sCol=j+1; tCol=j+2; break; }
    }
    if (wCol !== 3) break;
  }

  for (let i = 0; i < rows.length; i++) {
    const raw = rows[i].map(c=>(c||'').toString().trim());
    const txt = raw.join(' ').toLowerCase();

    // Opening balance (before any months)
    if ((txt.includes('bal b/f')||txt.includes('bal b/d')) && months.length===0) {
      waterBF   = parseKsh(raw[wCol]||raw[wCol-1]||'0', true);
      serviceBF = parseKsh(raw[sCol]||raw[sCol-1]||'0', true);
      continue;
    }

    // Charges row — store as pending (handles charges BEFORE month label)
    if ((txt.includes('water and service')||txt.includes('water & service')) &&
        !txt.includes('closing') && !txt.includes('sum total')) {
      const w = parseKsh(raw[wCol]||'0');
      const s = parseKsh(raw[sCol]||'0');
      if (w > 0) pendingW = w;
      if (s > 0) pendingS = s;
      if (currentMonth) {
        if (w > 0) currentMonth.water = w;
        if (s > 0) currentMonth.service = s;
      }
    }

    // Payment row — negative values = payments
    if (txt.includes('payment') && !txt.includes('closing') &&
        !txt.includes('sum') && !txt.includes('total bal') && !txt.includes('bal b')) {
      for (let j = Math.max(0,wCol-1); j <= tCol; j++) {
        if (!raw[j]) continue;
        if (raw[j].includes('-')) {
          const p = parseKsh(raw[j]);
          if (p > 0) { if (currentMonth) currentMonth.payment += p; else pendingP += p; }
        }
      }
    }

    // Month label row
    const mCell = [raw[0],raw[1],raw[2]].find(c=>MONTH_RE.test(c));
    if (mCell) {
      const existing = months.find(m=>m.month.toLowerCase()===mCell.toLowerCase());
      if (existing) {
        currentMonth = existing;
        // Check for payment on same row as existing month
        if (txt.includes('payment')) {
          let totalPay = 0;
          for (let j = Math.max(0,wCol-1); j <= tCol; j++) {
            if (!raw[j]) continue;
            if (raw[j].includes('-')) {
              const p = parseKsh(raw[j]);
              totalPay += p;
            }
          }
          if (totalPay > 0) currentMonth.payment = totalPay;
        }
        continue;
      }
      const prev = months.length > 0 ? months[months.length-1] : null;
      currentMonth = {
        month: mCell,
        water: pendingW, service: pendingS,
        waterBF:   prev ? prev.waterClosing   : waterBF,
        serviceBF: prev ? prev.serviceClosing : serviceBF,
        waterClosing: 0, serviceClosing: 0,
        payment: pendingP, balance: 0,
      };
      pendingW=0; pendingS=0; pendingP=0;
      months.push(currentMonth);
      // Check for payment on same row as month label
      if (txt.includes('payment')) {
        let totalPay = 0;
        for (let j = Math.max(0,wCol-1); j <= tCol; j++) {
          if (!raw[j]) continue;
          if (raw[j].includes('-')) {
            const p = parseKsh(raw[j]);
            totalPay += p;
          }
        }
        if (totalPay > 0) currentMonth.payment = totalPay;
      }
      continue;
    }

    if (!currentMonth) continue;

    // Closing balance
    if (txt.includes('closing') && txt.includes('balance')) {
      currentMonth.waterClosing   = parseKsh(raw[wCol]||'0', true);
      currentMonth.serviceClosing = parseKsh(raw[sCol]||'0', true);
      const tc = parseKsh(raw[tCol]||'0', true);
      currentMonth.balance = Math.abs(tc) || Math.abs(currentMonth.waterClosing + currentMonth.serviceClosing);
    }
  }

  return { unit:unitName, name:ownerName, months, waterBF, serviceBF };
}

function fmt(n) {
  if (n<0) return '<span style="color:var(--accent)">Credit KSh '+Number(Math.abs(n)).toLocaleString('en-KE',{minimumFractionDigits:2})+'</span>';
  return 'KSh '+Number(n).toLocaleString('en-KE',{minimumFractionDigits:2});
}

// ── RENDER HOMEOWNER ─────────────────────────
function renderHomeowner(data, lastUpdated) {

  if (!months.length) return `<p style="color:var(--muted);padding:2rem 0">No data found. Please contact your property manager.</p>`;

    if (last.water===0&&last.service===0&&last.payment===0&&last.balance===0) idx=months.length-2;
  }
  const latest=months[idx], prev=idx>0?months[idx-1]:null;
  const wSub=latest.waterBF+latest.water, sSub=latest.serviceBF+latest.service;
  const grand=wSub+sSub;
  const outstanding=latest.balance>0?latest.balance:(grand>0&&latest.water===0&&latest.service===0?grand:latest.balance);
  const isCredit=latest.balance<0;
  const hasBal=outstanding>0&&!isCredit;

  let insight='';
  if (prev&&prev.water>0) {
    const d=latest.water-prev.water, pct=Math.round(Math.abs(d)/prev.water*100);
    if (d>0) insight=`Your water bill increased by ${pct}% vs ${prev.month}. Check for leaks.`;
    else if (d<0) insight=`Your water bill decreased by ${pct}% vs ${prev.month}. Great job!`;
    else insight=`Your water bill is unchanged from ${prev.month}.`;
  }

  const maxW=Math.max(...months.map(m=>m.water),1);
  const bars=months.map(m=>{
    const h=Math.max(Math.round((m.water/maxW)*100),2);
    const lbl=m.month.replace(/[-– ]\d{2}$/,'').substring(0,3);

  const tRows=[...months].reverse().map(m=>`

      <td>${m.month}</td>

      <td>${fmt(m.serviceBF)}</td><td>${fmt(m.service)}</td><td>${fmt(m.serviceBF+m.service)}</td>
      <td style="color:var(--accent)">${fmt(m.payment)}</td>
      <td style="color:${m.balance>0?'#e05c5c':'var(--accent)'};font-weight:500">${fmt(m.balance)}</td>
    </tr>`).join('');

  const mpesa=hasBal?`
    <div style="background:var(--surface);border:0.5px solid rgba(61,153,112,0.2);border-radius:14px;padding:1.5rem;margin-bottom:1.8rem">
      <div class="section-label" style="margin-bottom:1rem">Pay via M-Pesa</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1rem">
        <div style="background:var(--surface2);border-radius:8px;padding:0.9rem 1rem"><div class="card-label">Paybill</div><div style="font-size:18px;font-weight:500;color:var(--text);font-family:'DM Serif Display',serif">522522</div></div>
        <div style="background:var(--surface2);border-radius:8px;padding:0.9rem 1rem"><div class="card-label">Account</div><div style="font-size:18px;font-weight:500;color:var(--text);font-family:'DM Serif Display',serif">1313544337</div></div>
        <div style="background:var(--surface2);border-radius:8px;padding:0.9rem 1rem"><div class="card-label">Amount</div><div style="font-size:18px;font-weight:500;color:var(--accent);font-family:'DM Serif Display',serif">${fmt(outstanding)}</div></div>
      </div>
      <button onclick="copyMpesa(${outstanding})" style="background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;padding:10px 18px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500" id="copy-mpesa-btn">Copy payment details</button>
      <p style="font-size:11px;color:var(--muted);margin-top:10px">M-Pesa → Lipa na M-Pesa → Pay Bill</p>
    </div>`:''

  return `
    <div class="page-header" style="margin-bottom:2.2rem">
      <p class="page-eyebrow">Welcome back</p>
      <h1 class="page-title">${data.name}</h1>
      <p style="color:var(--muted);font-size:12px;margin-top:-1.5rem">Unit ${data.unit} &nbsp;·&nbsp; ${latest.month}</p>
    </div>
    ${hasBal?`<div class="alert alert-danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Outstanding balance: <strong>${fmt(outstanding)}</strong>. Please pay at your earliest convenience.</span></div>`:isCredit?`<div class="alert alert-success"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>You have an overpayment credit of <strong>KSh ${Math.abs(latest.balance).toLocaleString('en-KE',{minimumFractionDigits:2})}</strong>. This will be applied to your next bill.</span></div>`:`<div class="alert alert-success"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>Your account is fully cleared. No outstanding balance.</span></div>`}
    <div class="chart-box" style="margin-bottom:1.8rem">
      <div class="section-label" style="margin-bottom:1.4rem">Bill breakdown — ${latest.month}</div>
      <div style="margin-bottom:1px">
        <div style="background:rgba(61,153,112,0.06);border:0.5px solid rgba(61,153,112,0.15);border-radius:10px 10px 0 0;padding:8px 1.3rem"><span style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;font-weight:500">Water</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)">
          <div style="background:var(--surface2);padding:1rem 1.3rem"><div class="card-label">Balance b/f</div><div class="card-value" style="font-size:17px">${fmt(latest.waterBF)}</div></div>
          <div style="background:var(--surface2);padding:1rem 1.3rem"><div class="card-label">${latest.month} bill</div><div class="card-value" style="font-size:17px">${fmt(latest.water)}</div></div>
        </div>
        <div style="background:var(--surface);border:0.5px solid rgba(61,153,112,0.15);border-top:none;padding:0.9rem 1.3rem;display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:var(--muted);text-transform:uppercase">Water subtotal</span><span style="font-family:'DM Serif Display',serif;font-size:17px">${fmt(wSub)}</span></div>
      </div>
      <div style="margin-top:10px;margin-bottom:1px">
        <div style="background:rgba(201,168,76,0.06);border:0.5px solid rgba(201,168,76,0.15);border-radius:10px 10px 0 0;padding:8px 1.3rem"><span style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;font-weight:500">Service Charge</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)">
          <div style="background:var(--surface2);padding:1rem 1.3rem"><div class="card-label">Balance b/f</div><div class="card-value" style="font-size:17px">${fmt(latest.serviceBF)}</div></div>
          <div style="background:var(--surface2);padding:1rem 1.3rem"><div class="card-label">${latest.month} bill</div><div class="card-value" style="font-size:17px">${fmt(latest.service)}</div></div>
        </div>
        <div style="background:var(--surface);border:0.5px solid rgba(201,168,76,0.15);border-top:none;padding:0.9rem 1.3rem;display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:var(--muted);text-transform:uppercase">Service subtotal</span><span style="font-family:'DM Serif Display',serif;font-size:17px">${fmt(sSub)}</span></div>
      </div>
      <div style="background:var(--surface);border:0.5px solid rgba(61,153,112,0.25);border-radius:10px;padding:1.1rem 1.3rem;margin-top:10px;display:flex;justify-content:space-between;align-items:center">
        <div><div class="card-label">Grand total payable</div><div style="font-size:11px;color:var(--muted);margin-top:2px">Water + Service</div></div>
        <div class="card-value" style="font-size:22px;color:var(--accent)">${fmt(latest.balance>0?latest.balance:grand)}</div>
      </div>
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:1.1rem 1.3rem;margin-top:2px;display:flex;justify-content:space-between;align-items:center">
        <div class="card-label">Payment received</div>
        <div class="card-value" style="font-size:20px;color:var(--accent)">${fmt(latest.payment)}</div>
      </div>
      <div style="background:var(--surface);border:0.5px solid ${hasBal?'rgba(192,57,43,0.25)':'rgba(61,153,112,0.2)'};border-radius:10px;padding:1.1rem 1.3rem;margin-top:2px;display:flex;justify-content:space-between;align-items:center">
        <div><div class="card-label">Closing balance</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${hasBal?'Amount outstanding':'Fully cleared'}</div></div>
        <div class="card-value" style="font-size:22px;color:${hasBal?'#e05c5c':'var(--accent)'}">${fmt(outstanding)}</div>
      </div>
    </div>
    ${mpesa}
    ${insight?`<div class="insight"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d9970" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><p>${insight}</p></div>`:''}
    <div class="chart-box"><div class="section-label">Water bill trend</div><div class="bar-chart">${bars}</div></div>
    <div class="table-box">
      <div class="section-label">Transaction history</div>
      <table>
        <thead>
          <tr>
            <th rowspan="2" style="text-align:left;vertical-align:bottom">Month</th>
            <th colspan="3" style="text-align:center;border-bottom:none;color:var(--accent)">Water</th>
            <th colspan="3" style="text-align:center;border-bottom:none;color:var(--gold)">Service</th>
            <th rowspan="2" style="vertical-align:bottom">Payment</th>
            <th rowspan="2" style="vertical-align:bottom">Balance</th>
          </tr>
          <tr><th>B/f</th><th>Current</th><th>Subtotal</th><th>B/f</th><th>Current</th><th>Subtotal</th></tr>
        </thead>
        <tbody>${tRows}</tbody>
      </table>
    </div>
    <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.8rem">
      <div class="section-label" style="margin-bottom:1rem">Change password</div>
      <div id="pwd-msg" style="display:none;margin-bottom:0.8rem;font-size:13px;padding:8px 12px;border-radius:6px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div><label class="field-label">New password</label><input type="password" id="new-pwd" placeholder="New password" style="width:100%;background:var(--bg);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none"/></div>
        <div><label class="field-label">Confirm password</label><input type="password" id="confirm-pwd" placeholder="Confirm password" style="width:100%;background:var(--bg);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none"/></div>
      </div>
      <button onclick="changePassword()" style="background:var(--surface2);border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--text);font-size:13px;padding:10px 18px;cursor:pointer;font-family:'DM Sans',sans-serif">Update password</button>
      <p style="font-size:11px;color:var(--muted);margin-top:8px">Password is saved securely and works on all devices.</p>
    </div>
    <p class="timestamp">Last updated: ${lastUpdated}</p>`;
}

// ── RENDER ADMIN ─────────────────────────────
function renderAdmin(allData, lastUpdated) {
  const rows=allData.map(d=>{
    if (!d.months.length) return null;
    const l=d.months[d.months.length-1];
    return {unit:d.unit,name:d.name,month:l.month,water:l.water,service:l.service,total:l.water+l.service,payment:l.payment,balance:l.balance};
  }).filter(Boolean);
  const totalOut=rows.reduce((s,r)=>s+r.balance,0);
  const withBal=rows.filter(r=>r.balance>0).length;
  const collected=rows.reduce((s,r)=>s+r.payment,0);
  const tRows=rows.map(r=>`
    <tr>
      <td style="color:var(--accent);font-weight:500;text-align:left">${r.unit}</td>
      <td style="text-align:left;color:#bbb">${r.name}</td>
      <td>${fmt(r.water)}</td><td>${fmt(r.service)}</td>
      <td style="color:var(--text)">${fmt(r.total)}</td>
      <td style="color:var(--accent)">${fmt(r.payment)}</td>
      <td style="color:${r.balance>0?'#e05c5c':'var(--accent)'};font-weight:500">${fmt(r.balance)}</td>
      <td style="text-align:left"><span class="badge ${r.balance>0?'badge-red':'badge-green'}">${r.balance>0?'Outstanding':'Cleared'}</span></td>
    </tr>`).join('');
  return `
    <div class="page-header" style="margin-bottom:2.2rem">
      <p class="page-eyebrow">Admin overview</p>
      <h1 class="page-title">All Units — ${rows[0]?.month||''}</h1>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">Total units</div><div class="card-value">${rows.length}</div><div class="card-sub">Active</div></div>
      <div class="card"><div class="card-label">Units with balance</div><div class="card-value ${withBal>0?'red':'green'}">${withBal}</div><div class="card-sub">${withBal>0?'Need attention':'All clear'}</div></div>
      <div class="card"><div class="card-label">Total outstanding</div><div class="card-value ${totalOut>0?'red':'green'}">${fmt(totalOut)}</div><div class="card-sub">This month</div></div>
      <div class="card"><div class="card-label">Payments received</div><div class="card-value green">${fmt(collected)}</div><div class="card-sub">This month</div></div>
    </div>
    <div class="table-box">
      <div class="section-label">Unit summary</div>
      <table>
        <thead><tr><th style="text-align:left">Unit</th><th style="text-align:left">Homeowner</th><th>Water</th><th>Service</th><th>Total</th><th>Payment</th><th>Balance</th><th style="text-align:left">Status</th></tr></thead>
        <tbody>${tRows}</tbody>
      </table>
    </div>
    <p class="timestamp">Last updated: ${lastUpdated}</p>`;
}

// ── HELPERS ───────────────────────────────────
function togglePwd(){const i=document.getElementById('password-input'),ic=document.getElementById('eye-icon');if(i.type==='password'){i.type='text';ic.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';}else{i.type='password';ic.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';}}

function copyMpesa(amount){const t=`Paybill: 522522\nAccount: 1313544337\nAmount: KSh ${Number(amount).toLocaleString()}`;navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('copy-mpesa-btn');if(b){b.textContent='Copied!';setTimeout(()=>b.textContent='Copy payment details',2000);}}).catch(()=>alert(t));}

async function changePassword(){
  const np=document.getElementById('new-pwd').value,cp=document.getElementById('confirm-pwd').value,m=document.getElementById('pwd-msg');
  const show=(msg,ok)=>{m.style.display='block';m.style.background=ok?'rgba(61,153,112,0.1)':'rgba(192,57,43,0.1)';m.style.color=ok?'#6dbf9a':'#e07070';m.textContent=msg;};
  if(!np||np.length<6){show('Password must be at least 6 characters.');return;}
  if(np!==cp){show('Passwords do not match.');return;}
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+currentUser.token},body:JSON.stringify({password:np})});
    const d=await r.json();
    if(d.id||d.email){show('Password updated successfully!',true);document.getElementById('new-pwd').value='';document.getElementById('confirm-pwd').value='';}
    else throw new Error(d.message||'Failed');
  }catch(e){show('Error: '+e.message);}
}

// ── AUTH ──────────────────────────────────────
let currentUser=null;
const SS='pp_session';
function saveSession(u){localStorage.setItem(SS,JSON.stringify(u));}
function clearSession(){localStorage.removeItem(SS);}
function getSession(){try{return JSON.parse(localStorage.getItem(SS));}catch{return null;}}

async function loadApp(user) {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('nav-unit').textContent=user.role==='admin'?'Admin':`Unit ${user.unit}`;
  document.getElementById('admin-badge').style.display=user.role==='admin'?'inline':'none';
  const lastUpdated=await fetchLastUpdated();
  if (user.role==='admin') {
    const allData=await Promise.all(ALL_UNITS.map(async u=>{
      try{const rows=await fetchSheet(u.unit);return parseSheet(rows,u.unit,u.name);}
      catch{return {unit:u.unit,name:u.name,months:[]};}
    }));
    document.getElementById('main-content').innerHTML=renderAdmin(allData,lastUpdated);
  } else {
    const rows=await fetchSheet(user.unit);
    const data=parseSheet(rows,user.unit,user.name);
    document.getElementById('main-content').innerHTML=renderHomeowner(data,lastUpdated);
  }
}

document.getElementById('login-btn').addEventListener('click',handleLogin);
document.getElementById('password-input').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});

(async()=>{
  const saved=getSession();
  if(!saved?.token)return;
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+saved.token}});
    if(r.ok){currentUser=saved;await loadApp(saved);}else clearSession();
  }catch{clearSession();}
})();

document.getElementById('forgot-link').addEventListener('click',async e=>{
  e.preventDefault();
  const email=document.getElementById('email-input').value.trim();
  const m=document.getElementById('forgot-msg');
  if(!email){m.style.display='block';m.style.background='rgba(192,57,43,0.1)';m.style.color='#e07070';m.textContent='Please enter your email first.';return;}
  await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,redirect_to:'https://property-portal-sooty.vercel.app'})});
  m.style.display='block';m.style.background='rgba(61,153,112,0.1)';m.style.color='#6dbf9a';m.textContent='Reset email sent. Check your inbox.';
});

document.getElementById('signout-btn').addEventListener('click',async()=>{
  if(currentUser?.token)await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+currentUser.token}}).catch(()=>{});
  currentUser=null;clearSession();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('email-input').value='';
  document.getElementById('password-input').value='';
  document.getElementById('error-msg').style.display='none';
});

async function handleLogin(){
  const email=document.getElementById('email-input').value.trim().toLowerCase();
  const password=document.getElementById('password-input').value;
  const errEl=document.getElementById('error-msg'),loadEl=document.getElementById('loading-msg');
  errEl.style.display='none';loadEl.style.display='none';
  if(!email||!password){errEl.textContent='Please enter your email and password.';errEl.style.display='block';return;}
  loadEl.style.display='block';document.getElementById('login-btn').disabled=true;
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,password})});
    const auth=await r.json();
    if(!auth.access_token){errEl.textContent='Incorrect email or password.';errEl.style.display='block';return;}
    const meta=auth.user?.user_metadata||{};
    const unit=meta.unit||'',name=meta.name||email;
    const isAdmin=email===ADMIN_EMAIL||unit==='ADMIN';
    currentUser={email,token:auth.access_token,unit,name,role:isAdmin?'admin':'homeowner'};
    saveSession(currentUser);
    await loadApp(currentUser);
  }catch(err){
    document.getElementById('main-content').innerHTML=`<div class="alert alert-danger" style="margin-top:2rem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Could not load data. (${err.message})</span></div>`;
  }finally{loadEl.style.display='none';document.getElementById('login-btn').disabled=false;}
}
</script>
